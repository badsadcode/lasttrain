# Runs the simulation tests and exports a Windows build on every push to main.
# The zipped build is attached to the workflow run as an artifact ("LastTrain-windows").
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Simulation tests
        run: dotnet test tests/LastTrain.Tests

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-windows

      - name: Download Godot and Windows export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q templates.tpz 'templates/windows_*_x86_64*' 'templates/version.txt' && rm templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$dest" && mv templates/* "$dest/"

      - name: Export Windows build
        run: |
          GODOT=$(find ~/godot -name 'Godot_v*_mono_linux.x86_64' -type f | head -1)
          "$GODOT" --headless --path . --import || true
          mkdir -p build/windows
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/LastTrain.exe
          test -f build/windows/LastTrain.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LastTrain-windows
          path: build/windows/
          retention-days: 30
